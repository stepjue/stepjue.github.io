<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stephen Jue</title>
    <meta
      name="description"
      content="A photography portfolio by Stephen Jue."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lekton:ital,wght@0,400;0,700;1,400&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      href="images/untitled/02-thumb.jpg"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="images/foss/thumbs/06.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 class="site-title">
        <a class="identity" href="./">Stephen Jue</a>
      </h1>
    </header>

    <main class="portfolio" aria-label="Photography portfolio">
      <section
        class="portfolio-section featured-project"
        aria-labelledby="untitled-title"
      >
        <h2 class="section-heading" id="untitled-title">
          Untitled <span class="section-status">ongoing</span>
        </h2>
        <p class="project-note">
          Ordinary scenes that seemed slightly out of place.
        </p>
        <div class="project-spotlight">
          <a
            class="tile project-cover"
            href="images/untitled/02-web.jpg"
            aria-label="View: Shaped evergreen beside a building wall and empty parking lot"
          >
            <img
              src="images/untitled/02-thumb.jpg"
              width="1000"
              height="750"
              alt="Shaped evergreen beside a building wall and empty parking lot"
              loading="eager"
              fetchpriority="high"
            />
          </a>
          <a
            class="tile"
            href="images/untitled/01-web.jpg"
            aria-label="View: Green utility box isolated in a field"
          >
            <img
              src="images/untitled/01-thumb.jpg"
              width="1000"
              height="1000"
              alt="Green utility box isolated in a field"
              loading="lazy"
              decoding="async"
            />
          </a>
          <a
            class="tile"
            href="images/untitled/03-web.jpg"
            aria-label="View: Door set high on a red metal wall"
          >
            <img
              src="images/untitled/03-thumb.jpg"
              width="562"
              height="1000"
              alt="Door set high on a red metal wall"
              loading="lazy"
              decoding="async"
            />
          </a>
        </div>
      </section>

      <section
        class="portfolio-section selected-work"
        aria-labelledby="selected-title"
      >
        <h2 class="section-heading" id="selected-title">
          Selected Photographs
        </h2>

        <div class="portfolio-grid">
          <a
            class="tile"
            href="images/foss/web/06.jpg"
            aria-label="View: White church with a bright red roof centered against sweeping hillsides"
          >
            <picture>
              <source srcset="images/foss/thumbs/06.webp" type="image/webp" />
              <img
                src="images/foss/thumbs/06.jpg"
                width="1000"
                height="667"
                alt="White church with a bright red roof centered against sweeping hillsides"
                loading="eager"
                fetchpriority="high"
              />
            </picture>
          </a>
          <a
            class="tile"
            href="images/other/other-web-1.jpg"
            aria-label="View: Blue reflections rippling across a glass facade"
          >
            <img
              src="images/other/other-thumb-1.jpg"
              width="1000"
              height="562"
              alt="Blue reflections rippling across a glass facade"
              loading="eager"
              fetchpriority="high"
            />
          </a>
          <a class="tile" href="images/mit/02-web.jpg">
            <img
              src="images/mit/02-thumb.jpg"
              width="1000"
              height="1000"
              loading="lazy"
              decoding="async"
            />
          </a>
          <a class="tile" href="images/mit/03-web.jpg">
            <img
              src="images/mit/03-thumb.jpg"
              width="1000"
              height="800"
              loading="lazy"
              decoding="async"
            />
          </a>
          <a
            class="tile"
            href="images/marsh/web/01.jpg"
            aria-label="View: A heron perched on a fallen tree in pale marsh water"
          >
            <img
              src="images/marsh/thumbs/01.jpg"
              width="1000"
              height="563"
              alt="A heron perched on a fallen tree in pale marsh water"
              loading="lazy"
              decoding="async"
            />
          </a>
          <a
            class="tile"
            href="images/marsh/web/03.jpg"
            aria-label="View: Rocks emerging from misty marsh water"
          >
            <img
              src="images/marsh/thumbs/03.jpg"
              width="1000"
              height="563"
              alt="Rocks emerging from misty marsh water"
              loading="lazy"
              decoding="async"
            />
          </a>
          <a class="tile" href="images/mit/01-web.jpg">
            <img
              src="images/mit/01-thumb.jpg"
              width="1000"
              height="1000"
              loading="lazy"
              decoding="async"
            />
          </a>
          <a
            class="tile"
            href="images/other/other-web-3.jpg"
            aria-label="View: Light reflections on a wall"
          >
            <img
              src="images/other/other-thumb-3.jpg"
              width="1000"
              height="721"
              alt="Light reflections on a wall"
              loading="lazy"
              decoding="async"
            />
          </a>
          <a
            class="tile"
            href="images/foss/web/02.jpg"
            aria-label="View: Waterfall spray and a rainbow in an abstracted landscape"
          >
            <img
              src="images/foss/thumbs/02.jpg"
              width="1000"
              height="667"
              alt="Waterfall spray and a rainbow in an abstracted landscape"
              loading="lazy"
              decoding="async"
            />
          </a>
        </div>
      </section>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="Image preview">
      <div class="lightbox-media">
        <img class="lightbox-preview" id="lightbox-preview" alt="" />
        <img class="lightbox-full" id="lightbox-img" alt="" decoding="async" />
      </div>
      <button class="lightbox-close" type="button">Close</button>
    </dialog>

    <footer>
      <span class="contact" id="email"></span>
    </footer>

    <script>
      const tiles = document.querySelectorAll(".tile");
      const lightbox = document.getElementById("lightbox");
      const lightboxPreview = document.getElementById("lightbox-preview");
      const lightboxImg = document.getElementById("lightbox-img");
      const closeButton = lightbox.querySelector(".lightbox-close");
      let activeTile;
      let lightboxLoadId = 0;

      tiles.forEach((tile) => {
        const thumbnail = tile.querySelector("img");

        function revealThumbnail() {
          const reveal = () => {
            requestAnimationFrame(() => tile.classList.add("is-loaded"));
          };

          if (thumbnail.decode) {
            thumbnail.decode().then(reveal, reveal);
          } else {
            reveal();
          }
        }

        if (thumbnail.complete) {
          revealThumbnail();
        } else {
          thumbnail.addEventListener("load", revealThumbnail, { once: true });
          thumbnail.addEventListener(
            "error",
            () => tile.classList.add("is-loaded"),
            { once: true },
          );
        }

        tile.addEventListener("click", (event) => {
          event.preventDefault();

          const loadId = ++lightboxLoadId;
          activeTile = tile;
          lightbox.classList.remove("is-loaded", "is-error");
          lightboxPreview.src = thumbnail.currentSrc || thumbnail.src;
          lightboxImg.alt = thumbnail.alt;
          lightboxImg.removeAttribute("src");
          document.body.classList.add("lightbox-open");
          lightbox.showModal();

          lightboxImg.onload = () => {
            const reveal = () => {
              if (loadId !== lightboxLoadId || !lightbox.open) return;
              requestAnimationFrame(() => lightbox.classList.add("is-loaded"));
            };

            if (lightboxImg.decode) {
              lightboxImg.decode().then(reveal, reveal);
            } else {
              reveal();
            }
          };

          lightboxImg.onerror = () => {
            if (loadId === lightboxLoadId) {
              lightbox.classList.add("is-error");
            }
          };

          lightboxImg.src = tile.href;
        });
      });

      function closeLightbox() {
        if (lightbox.open) lightbox.close();
      }

      function resetLightbox() {
        lightboxLoadId += 1;
        document.body.classList.remove("lightbox-open");
        lightbox.classList.remove("is-loaded", "is-error");
        lightboxPreview.removeAttribute("src");
        lightboxImg.removeAttribute("src");
        lightboxImg.alt = "";
        lightboxImg.onload = null;
        lightboxImg.onerror = null;
        activeTile?.focus();
        activeTile = undefined;
      }

      closeButton.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      lightbox.addEventListener("close", resetLightbox);

      const email = ["hello", "@", "stephenjue", ".", "com"].join("");
      const emailLink = document.createElement("a");
      emailLink.href = `mailto:${email}`;
      emailLink.textContent = "contact";
      document.getElementById("email").append(emailLink);
    </script>
    <!-- Cloudflare Web Analytics -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"

    ></script>

  </body>
</html>

<!doctype html>
<html lang="en">
  <head>

    <link rel="canonical" href="https://stephenjue.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stephen Jue" />
    <meta

    <meta property="og:url" content="https://stephenjue.com/" />

    <meta name="twitter:card" content="summary_large_image" />

    />
    <meta

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

      as="image"
      href="images/portfolio/zakim-web.jpg"
      fetchpriority="high"
    />
    <script>
      document.documentElement.classList.add("js");
    </script>

  </head>
  <body>
    <header>
      <h1 class="site-title">
        <a class="identity" href="./">Stephen Jue</a>
      </h1>
    </header>

    <main class="portfolio" aria-label="Photography portfolio">
      <section class="portfolio-wall" aria-label="Selected photographs">
        <a
          class="wall-item tile"
          href="images/portfolio/zakim-web.jpg"
          aria-label="View: Streetlamp visually suspended above the Zakim Bridge"
          data-set="uncanny-objects"
          data-set-priority="together"
          data-row-span="2"
        >
          <!-- Zakim spans two desktop rows, so use the web asset here intentionally. -->
          <img
            src="images/portfolio/zakim-web.jpg"
            width="1334"
            height="2000"
            alt="Streetlamp visually suspended above the Zakim Bridge"
            loading="eager"
            fetchpriority="high"
          />
        </a>

        <a
          class="wall-item tile"
          href="images/portfolio/ceiling-mirror-light-web.jpg"
          aria-label="View: Ceiling mirror with an arc light fixture reflecting ground and a bench"
          data-set="uncanny-objects"
          data-set-priority="together"
        >
          <img
            src="images/portfolio/ceiling-mirror-light-thumb.jpg"
            width="1000"
            height="1000"
            alt="Ceiling mirror with an arc light fixture reflecting ground and a bench"
            loading="eager"
            decoding="async"
          />
        </a>

        <a
          class="wall-item tile"
          href="images/portfolio/yellow-mirror-planter-web.jpg"
          aria-label="View: Curved mirror reflecting a planter against yellow light"
          data-set="uncanny-objects"
          data-set-priority="together"
        >
          <img
            src="images/portfolio/yellow-mirror-planter-thumb.jpg"
            width="1000"
            height="800"
            alt="Curved mirror reflecting a planter against yellow light"
            loading="eager"
            decoding="async"
          />
        </a>
      </section>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="Image preview">
      <div class="lightbox-media">
        <img class="lightbox-preview" id="lightbox-preview" alt="" />
        <img class="lightbox-full" id="lightbox-img" alt="" decoding="async" />
      </div>
      <button class="lightbox-close" type="button">Close</button>
    </dialog>

    <footer>
      <span class="contact" id="email"></span>
    </footer>

    <script>
      const tiles = document.querySelectorAll(".tile");
      const lightbox = document.getElementById("lightbox");
      const lightboxPreview = document.getElementById("lightbox-preview");
      const lightboxImg = document.getElementById("lightbox-img");
      const closeButton = lightbox.querySelector(".lightbox-close");
      const portfolioWall = document.querySelector(".portfolio-wall");
      const desktopWallQuery = window.matchMedia("(min-width: 701px)");
      const touchLabelQuery = window.matchMedia(
        "(hover: none), (pointer: coarse)",
      );
      let wallLayoutRaf = 0;
      let activeTile;
      let lightboxLoadId = 0;
      let labelHideTimer = 0;

      function getImageRatio(img) {
        const width = Number(img.getAttribute("width")) || img.naturalWidth;
        const height = Number(img.getAttribute("height")) || img.naturalHeight;

        if (!width || !height) return 1;

        return width / height;
      }

      function layoutPortfolioWall() {
        wallLayoutRaf = 0;

        if (!portfolioWall) return;

        const wallItems = Array.from(
          portfolioWall.querySelectorAll(".wall-item"),
        );

        if (!desktopWallQuery.matches) {
          portfolioWall.style.removeProperty("height");
          wallItems.forEach((item) => {
            item.style.removeProperty("position");
            item.style.removeProperty("width");
            item.style.removeProperty("transform");
          });
          return;
        }

        const styles = window.getComputedStyle(portfolioWall);
        const gap = parseFloat(styles.getPropertyValue("--wall-gap")) || 20;
        const wallWidth = portfolioWall.clientWidth;
        const targetRowHeight = Math.min(
          340,
          Math.max(210, wallWidth * 0.28),
        );
        const setSizes = wallItems.reduce((sizes, item) => {
          if (item.dataset.setPriority !== "together" || !item.dataset.set) {
            return sizes;
          }

          sizes.set(item.dataset.set, (sizes.get(item.dataset.set) || 0) + 1);
          return sizes;
        }, new Map());

        function getImageForItem(item) {
          return item.querySelector("img");
        }

        function getRowCandidate(startIndex, count) {
          const rowItems = wallItems.slice(startIndex, startIndex + count);
          const ratios = rowItems
            .map(getImageForItem)
            .filter(Boolean)
            .map(getImageRatio);

          if (ratios.length !== count) return null;

          const rowGaps = gap * (count - 1);
          const ratioTotal = ratios.reduce((total, ratio) => total + ratio, 0);
          const rowHeight = (wallWidth - rowGaps) / ratioTotal;
          const hasFeaturedItem = rowItems.some(
            (item) => item.dataset.weight === "feature",
          );
          const rowTargetHeight = hasFeaturedItem
            ? targetRowHeight * 1.12
            : targetRowHeight;
          const heightPenalty = Math.abs(rowHeight - rowTargetHeight);
          const oversizedPenalty = Math.max(
            0,
            rowHeight - rowTargetHeight * 1.35,
          );
          const compressedPenalty = Math.max(
            0,
            rowTargetHeight * 0.7 - rowHeight,
          );
          const rowSetCounts = rowItems.reduce((counts, item) => {
            if (item.dataset.setPriority === "together" && item.dataset.set) {
              counts.set(
                item.dataset.set,
                (counts.get(item.dataset.set) || 0) + 1,
              );
            }

            return counts;
          }, new Map());
          const setPenalty = Array.from(rowSetCounts).reduce(
            (penalty, [setName, rowSetCount]) => {
              const setSize = setSizes.get(setName) || 0;

              return rowSetCount < setSize
                ? penalty + rowTargetHeight * setSize
                : penalty;
            },
            0,
          );
          const rowSpanPenalty = rowItems.some((item) => item.dataset.rowSpan)
            ? rowTargetHeight * 2
            : 0;
          const singlePenalty = count === 1 ? rowTargetHeight * 0.5 : 0;
          const pairPenalty = count === 2 ? rowTargetHeight * 0.04 : 0;
          const score =
            heightPenalty +
            oversizedPenalty * 3 +
            compressedPenalty * 4 +
            setPenalty +
            rowSpanPenalty +
            singlePenalty +
            pairPenalty;

          return {
            count,
            rowHeight,
            rowItems,
            score,
          };
        }

        function getSpanStackCandidate(startIndex) {
          const spanItem = wallItems[startIndex];
          const topItem = wallItems[startIndex + 1];
          const bottomItem = wallItems[startIndex + 2];

          if (
            spanItem?.dataset.rowSpan !== "2" ||
            !topItem ||
            !bottomItem ||
            topItem.dataset.rowSpan ||
            bottomItem.dataset.rowSpan
          ) {
            return null;
          }

          const spanRatio = getImageRatio(getImageForItem(spanItem));
          const topRatio = getImageRatio(getImageForItem(topItem));
          const bottomRatio = getImageRatio(getImageForItem(bottomItem));

          if (!spanRatio || !topRatio || !bottomRatio) return null;

          const stackWidth =
            (wallWidth - gap * (1 + spanRatio)) /
            (1 + spanRatio * (1 / topRatio + 1 / bottomRatio));
          const topHeight = stackWidth / topRatio;
          const bottomHeight = stackWidth / bottomRatio;
          const spanHeight = topHeight + gap + bottomHeight;
          const spanWidth = spanRatio * spanHeight;
          const rowTargetHeight = targetRowHeight * 2 + gap;
          const heightPenalty = Math.abs(spanHeight - rowTargetHeight);
          const widthBalancePenalty = Math.abs(spanWidth - stackWidth) * 0.12;
          const score = heightPenalty + widthBalancePenalty;

          return {
            count: 3,
            kind: "span-stack",
            rowItems: [spanItem, topItem, bottomItem],
            score,
            spanWidth,
            stackWidth,
            topHeight,
            bottomHeight,
            rowHeight: spanHeight,
          };
        }

        function getWallLayout(startIndex, memo = new Map()) {
          if (startIndex >= wallItems.length) {
            return {
              score: 0,
              rows: [],
            };
          }

          if (memo.has(startIndex)) return memo.get(startIndex);

          const remaining = wallItems.length - startIndex;
          let bestLayout;
          const spanStack = getSpanStackCandidate(startIndex);

          if (spanStack) {
            const nextLayout = getWallLayout(startIndex + spanStack.count, memo);
            bestLayout = {
              score: spanStack.score + nextLayout.score,
              rows: [spanStack, ...nextLayout.rows],
            };
          }

          for (let count = 1; count <= Math.min(3, remaining); count += 1) {
            const row = getRowCandidate(startIndex, count);
            if (!row) continue;

            const nextLayout = getWallLayout(startIndex + count, memo);
            const layout = {
              score: row.score + nextLayout.score,
              rows: [row, ...nextLayout.rows],
            };

            if (!bestLayout || layout.score < bestLayout.score) {
              bestLayout = layout;
            }
          }

          memo.set(startIndex, bestLayout);
          return bestLayout;
        }

        let rowY = 0;
        const layout = getWallLayout(0);

        if (!layout) return;

        layout.rows.forEach((row) => {
          if (row.kind === "span-stack") {
            const [spanItem, topItem, bottomItem] = row.rowItems;
            const stackX = row.spanWidth + gap;

            spanItem.style.position = "absolute";
            spanItem.style.width = `${row.spanWidth}px`;
            spanItem.style.transform = `translate3d(0, ${rowY}px, 0)`;

            topItem.style.position = "absolute";
            topItem.style.width = `${row.stackWidth}px`;
            topItem.style.transform = `translate3d(${stackX}px, ${rowY}px, 0)`;

            bottomItem.style.position = "absolute";
            bottomItem.style.width = `${row.stackWidth}px`;
            bottomItem.style.transform = `translate3d(${stackX}px, ${
              rowY + row.topHeight + gap
            }px, 0)`;

            rowY += row.rowHeight + gap;
            return;
          }

          let rowX = 0;

          row.rowItems.forEach((item, rowIndex) => {
            const img = getImageForItem(item);
            if (!img) return;

            const ratio = getImageRatio(img);
            const itemWidth =
              rowIndex === row.rowItems.length - 1
                ? wallWidth - rowX
                : row.rowHeight * ratio;

            item.style.position = "absolute";
            item.style.width = `${itemWidth}px`;
            item.style.transform = `translate3d(${rowX}px, ${rowY}px, 0)`;
            rowX += itemWidth + gap;
          });

          rowY += row.rowHeight + gap;
        });

        portfolioWall.style.height = `${Math.max(0, rowY - gap)}px`;
      }

      function requestWallLayout() {
        if (wallLayoutRaf) return;
        wallLayoutRaf = window.requestAnimationFrame(layoutPortfolioWall);
      }

      tiles.forEach((tile) => {
        const thumbnail = tile.querySelector("img");

        function revealThumbnail() {
          const reveal = () => {
            requestAnimationFrame(() => {
              tile.classList.add("is-loaded");
              requestWallLayout();
            });
          };

          if (thumbnail.decode) {
            thumbnail.decode().then(reveal, reveal);
          } else {
            reveal();
          }
        }

        if (thumbnail.complete) {
          revealThumbnail();
        } else {
          thumbnail.addEventListener("load", revealThumbnail, { once: true });
          thumbnail.addEventListener(
            "error",
            () => {
              tile.classList.add("is-loaded");
              requestWallLayout();
            },
            { once: true },
          );
        }

        tile.addEventListener("click", (event) => {
          if (
            touchLabelQuery.matches &&
            tile.dataset.label &&
            !tile.classList.contains("is-label-visible")
          ) {
            event.preventDefault();
            clearTimeout(labelHideTimer);
            tiles.forEach((otherTile) => {
              if (otherTile !== tile) {
                otherTile.classList.remove("is-label-visible");
              }
            });
            tile.classList.add("is-label-visible");
            labelHideTimer = window.setTimeout(() => {
              tile.classList.remove("is-label-visible");
            }, 2200);
            return;
          }

          event.preventDefault();
          clearTimeout(labelHideTimer);
          tiles.forEach((otherTile) => {
            otherTile.classList.remove("is-label-visible");
          });

          const loadId = ++lightboxLoadId;
          activeTile = tile;
          lightbox.classList.remove("is-loaded", "is-error");
          lightboxPreview.src = thumbnail.currentSrc || thumbnail.src;
          lightboxPreview.alt = thumbnail.alt;
          lightboxImg.alt = thumbnail.alt;
          lightboxImg.removeAttribute("src");
          document.body.classList.add("lightbox-open");
          lightbox.showModal();

          lightboxImg.onload = () => {
            const reveal = () => {
              if (loadId !== lightboxLoadId || !lightbox.open) return;
              requestAnimationFrame(() => lightbox.classList.add("is-loaded"));
            };

            if (lightboxImg.decode) {
              lightboxImg.decode().then(reveal, reveal);
            } else {
              reveal();
            }
          };

          lightboxImg.onerror = () => {
            if (loadId === lightboxLoadId) {
              lightbox.classList.add("is-error");
            }
          };

          lightboxImg.src = tile.href;
        });
      });

      function closeLightbox() {
        if (lightbox.open) lightbox.close();
      }

      function resetLightbox() {
        lightboxLoadId += 1;
        document.body.classList.remove("lightbox-open");
        lightbox.classList.remove("is-loaded", "is-error");
        lightboxPreview.removeAttribute("src");
        lightboxImg.removeAttribute("src");
        lightboxPreview.alt = "";
        lightboxImg.alt = "";
        lightboxImg.onload = null;
        lightboxImg.onerror = null;
        activeTile?.focus();
        activeTile = undefined;
      }

      closeButton.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      lightbox.addEventListener("close", resetLightbox);

      const email = ["hello", "@", "stephenjue", ".", "com"].join("");
      const emailLink = document.createElement("a");
      emailLink.href = `mailto:${email}`;
      emailLink.textContent = "contact";
      document.getElementById("email").append(emailLink);

      if (portfolioWall) {
        const wallResizeObserver = new ResizeObserver(requestWallLayout);
        wallResizeObserver.observe(portfolioWall);
      }

      window.addEventListener("load", requestWallLayout);
      window.addEventListener("resize", requestWallLayout);
      desktopWallQuery.addEventListener("change", requestWallLayout);
      document.fonts?.ready.then(requestWallLayout);

      requestWallLayout();
    </script>

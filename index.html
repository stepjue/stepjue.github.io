<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stephen Jue</title>
    <meta
      name="description"
      content="A photography portfolio by Stephen Jue."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lekton:ital,wght@0,400;0,700;1,400&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      href="images/field-index/shaped-evergreen-thumb.jpg"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="images/other-photos/red-roof-church-thumb.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 class="site-title">
        <a class="identity" href="./">Stephen Jue</a>
      </h1>
    </header>

    <main class="portfolio" aria-label="Photography portfolio">
      <section
        class="portfolio-section featured-project"
        aria-labelledby="field-index-title"
      >
        <div class="project-scroll-frame">
          <h2 class="section-heading" id="field-index-title">
            Field Index <span class="section-status">ongoing observations</span>
          </h2>
          <div class="project-spotlight">
            <a
              class="tile project-cover"
              href="images/field-index/shaped-evergreen-web.jpg"
              aria-label="View: Shaped evergreen beside a building wall and empty parking lot"
            >
              <img
                src="images/field-index/shaped-evergreen-thumb.jpg"
                width="1000"
                height="750"
                alt="Shaped evergreen beside a building wall and empty parking lot"
                loading="eager"
                fetchpriority="high"
              />
            </a>
            <a
              class="tile"
              href="images/field-index/green-utility-box-web.jpg"
              aria-label="View: Green utility box isolated in a field"
            >
              <img
                src="images/field-index/green-utility-box-thumb.jpg"
                width="1000"
                height="1000"
                alt="Green utility box isolated in a field"
                loading="lazy"
                decoding="async"
              />
            </a>
            <a
              class="tile"
              href="images/field-index/red-wall-door-web.jpg"
              aria-label="View: Door set high on a red metal wall"
            >
              <img
                src="images/field-index/red-wall-door-thumb.jpg"
                width="562"
                height="1000"
                alt="Door set high on a red metal wall"
                loading="lazy"
                decoding="async"
              />
            </a>
          </div>
        </div>
      </section>

      <section
        class="portfolio-section selected-work"
        aria-labelledby="selected-title"
      >
        <h2 class="section-heading" id="selected-title">Other Photos</h2>

        <div class="portfolio-grid">
          <a
            class="tile"
            href="images/other-photos/red-roof-church-web.jpg"
            aria-label="View: White church with a bright red roof centered against sweeping hillsides"
          >
            <picture>
              <source srcset="images/other-photos/red-roof-church-thumb.webp" type="image/webp" />
              <img
                src="images/other-photos/red-roof-church-thumb.jpg"
                width="1000"
                height="667"
                alt="White church with a bright red roof centered against sweeping hillsides"
                loading="eager"
                fetchpriority="high"
              />
            </picture>
          </a>
          <a
            class="tile"
            href="images/other-photos/ceiling-mirror-light-web.jpg"
            aria-label="View: Ceiling mirror with an arc light fixture reflecting ground and a bench"
          >
            <img
              src="images/other-photos/ceiling-mirror-light-thumb.jpg"
              width="1000"
              height="1000"
              alt="Ceiling mirror with an arc light fixture reflecting ground and a bench"
              loading="eager"
            />
          </a>
          <a
            class="tile"
            href="images/other-photos/layered-building-window-web.jpg"
            aria-label="View: Window and layered building surfaces beneath an overcast sky"
          >
            <img
              src="images/other-photos/layered-building-window-thumb.jpg"
              width="1000"
              height="750"
              alt="Window and layered building surfaces beneath an overcast sky"
              loading="eager"
            />
          </a>
          <a
            class="tile"
            href="images/other-photos/metal-surface-reflections-web.jpg"
            aria-label="View: Reflections across a weathered metal building surface"
          >
            <img
              src="images/other-photos/metal-surface-reflections-thumb.jpg"
              width="1000"
              height="1000"
              alt="Reflections across a weathered metal building surface"
              loading="lazy"
              decoding="async"
            />
          </a>
        </div>
      </section>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="Image preview">
      <div class="lightbox-media">
        <img class="lightbox-preview" id="lightbox-preview" alt="" />
        <img class="lightbox-full" id="lightbox-img" alt="" decoding="async" />
      </div>
      <button class="lightbox-close" type="button">Close</button>
    </dialog>

    <footer>
      <span class="contact" id="email"></span>
    </footer>

    <script>
      const tiles = document.querySelectorAll(".tile");
      const lightbox = document.getElementById("lightbox");
      const lightboxPreview = document.getElementById("lightbox-preview");
      const lightboxImg = document.getElementById("lightbox-img");
      const closeButton = lightbox.querySelector(".lightbox-close");
      let activeTile;
      let lightboxLoadId = 0;

      tiles.forEach((tile) => {
        const thumbnail = tile.querySelector("img");

        function revealThumbnail() {
          const reveal = () => {
            requestAnimationFrame(() => tile.classList.add("is-loaded"));
          };

          if (thumbnail.decode) {
            thumbnail.decode().then(reveal, reveal);
          } else {
            reveal();
          }
        }

        if (thumbnail.complete) {
          revealThumbnail();
        } else {
          thumbnail.addEventListener("load", revealThumbnail, { once: true });
          thumbnail.addEventListener(
            "error",
            () => tile.classList.add("is-loaded"),
            { once: true },
          );
        }

        tile.addEventListener("click", (event) => {
          event.preventDefault();

          const loadId = ++lightboxLoadId;
          activeTile = tile;
          lightbox.classList.remove("is-loaded", "is-error");
          lightboxPreview.src = thumbnail.currentSrc || thumbnail.src;
          lightboxPreview.alt = thumbnail.alt;
          lightboxImg.alt = thumbnail.alt;
          lightboxImg.removeAttribute("src");
          document.body.classList.add("lightbox-open");
          lightbox.showModal();

          lightboxImg.onload = () => {
            const reveal = () => {
              if (loadId !== lightboxLoadId || !lightbox.open) return;
              requestAnimationFrame(() => lightbox.classList.add("is-loaded"));
            };

            if (lightboxImg.decode) {
              lightboxImg.decode().then(reveal, reveal);
            } else {
              reveal();
            }
          };

          lightboxImg.onerror = () => {
            if (loadId === lightboxLoadId) {
              lightbox.classList.add("is-error");
            }
          };

          lightboxImg.src = tile.href;
        });
      });

      function closeLightbox() {
        if (lightbox.open) lightbox.close();
      }

      function resetLightbox() {
        lightboxLoadId += 1;
        document.body.classList.remove("lightbox-open");
        lightbox.classList.remove("is-loaded", "is-error");
        lightboxPreview.removeAttribute("src");
        lightboxImg.removeAttribute("src");
        lightboxPreview.alt = "";
        lightboxImg.alt = "";
        lightboxImg.onload = null;
        lightboxImg.onerror = null;
        activeTile?.focus();
        activeTile = undefined;
      }

      closeButton.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      lightbox.addEventListener("close", resetLightbox);

      const email = ["hello", "@", "stephenjue", ".", "com"].join("");
      const emailLink = document.createElement("a");
      emailLink.href = `mailto:${email}`;
      emailLink.textContent = "contact";
      document.getElementById("email").append(emailLink);

      const featuredProject = document.querySelector(".featured-project");
      const projectScrollFrame =
        featuredProject?.querySelector(".project-scroll-frame");
      const projectSpotlight =
        featuredProject?.querySelector(".project-spotlight");
      const desktopProjectQuery = window.matchMedia("(min-width: 701px)");
      let projectScrollRaf = 0;
      let projectWheelRaf = 0;
      let projectWheelDelta = 0;
      let projectOffset = 0;

      function getProjectMaxOffset() {
        if (!projectScrollFrame || !projectSpotlight) return 0;

        return Math.max(
          0,
          projectSpotlight.scrollWidth - projectScrollFrame.clientWidth,
        );
      }

      function setProjectOffset(offset) {
        if (!featuredProject) return;

        projectOffset = Math.min(Math.max(offset, 0), getProjectMaxOffset());
        featuredProject.style.setProperty(
          "--project-offset",
          `${projectOffset}px`,
        );
      }

      function syncProjectScroll() {
        projectScrollRaf = 0;

        if (!featuredProject || !projectScrollFrame || !projectSpotlight) {
          return;
        }

        if (!desktopProjectQuery.matches) {
          setProjectOffset(0);
          return;
        }

        setProjectOffset(projectOffset);
      }

      function requestProjectScrollSync() {
        if (projectScrollRaf) return;
        projectScrollRaf = window.requestAnimationFrame(syncProjectScroll);
      }

      function scrollProjectBy(delta) {
        if (!desktopProjectQuery.matches || !featuredProject) {
          return;
        }

        setProjectOffset(projectOffset + delta);
        requestProjectScrollSync();
      }

      function handleProjectWheel(event) {
        if (!desktopProjectQuery.matches || event.ctrlKey) {
          return;
        }

        const dominantDelta =
          Math.abs(event.deltaX) > Math.abs(event.deltaY)
            ? event.deltaX
            : event.deltaY;
        const maxOffset = getProjectMaxOffset();

        if (
          !dominantDelta ||
          maxOffset <= 0 ||
          (dominantDelta < 0 && projectOffset <= 0) ||
          (dominantDelta > 0 && projectOffset >= maxOffset)
        ) {
          return;
        }

        event.preventDefault();
        const delta =
          event.deltaMode === WheelEvent.DOM_DELTA_LINE
            ? dominantDelta * 16
            : dominantDelta;

        projectWheelDelta += delta;
        if (projectWheelRaf) return;
        projectWheelRaf = window.requestAnimationFrame(() => {
          const nextDelta = projectWheelDelta;
          projectWheelDelta = 0;
          projectWheelRaf = 0;
          scrollProjectBy(nextDelta);
        });
      }

      function handleProjectKeydown(event) {
        if (!desktopProjectQuery.matches) {
          return;
        }

        const maxOffset = getProjectMaxOffset();
        if (maxOffset <= 0) {
          return;
        }

        const keyOffsets = {
          ArrowLeft: -80,
          ArrowUp: -80,
          ArrowRight: 80,
          ArrowDown: 80,
          Home: -projectOffset,
          End: maxOffset - projectOffset,
        };
        const delta = keyOffsets[event.key];

        if (delta === undefined) {
          return;
        }

        const nextOffset = Math.min(
          Math.max(projectOffset + delta, 0),
          maxOffset,
        );

        if (nextOffset === projectOffset) {
          return;
        }

        event.preventDefault();
        setProjectOffset(nextOffset);
      }

      const projectResizeObserver = new ResizeObserver(requestProjectScrollSync);

      if (projectSpotlight) {
        projectResizeObserver.observe(projectSpotlight);
      }

      if (projectScrollFrame) {
        projectResizeObserver.observe(projectScrollFrame);
        projectScrollFrame.addEventListener("wheel", handleProjectWheel, {
          passive: false,
        });
        projectScrollFrame.addEventListener("keydown", handleProjectKeydown);
      }

      desktopProjectQuery.addEventListener("change", requestProjectScrollSync);
      window.addEventListener("load", requestProjectScrollSync);
      window.addEventListener("resize", requestProjectScrollSync);

      requestProjectScrollSync();
    </script>

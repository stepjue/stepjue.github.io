            <img

              width="1000"
              height="667"
              alt="White church with a bright red roof centered against sweeping hillsides"

              fetchpriority="high"
            />
          </picture>
        </a>
        <a class="tile" data-mobile-order="3" href="images/mit/02-web.jpg">
          <img
            src="images/mit/02-thumb.jpg"
            width="1000"
            height="1000"
            loading="lazy"
            decoding="async"
          />
        </a>
        <a
          class="tile"
          data-mobile-order="5"

          aria-label="View: A heron perched on a fallen tree in pale marsh water"
        >
          <img
            src="images/marsh/thumbs/01.jpg"

            decoding="async"
          />
        </a>
        <a class="tile" data-mobile-order="7" href="images/mit/01-web.jpg">
          <img
            src="images/mit/01-thumb.jpg"
            width="1000"
            height="1000"
            loading="lazy"
            decoding="async"
          />
        </a>
        <!-- <a
          class="tile"
          data-mobile-order="11"
          href="images/periphery/web/01.jpg"
          aria-label="View: Geometric industrial buildings beneath an overcast sky"
        >
          <img
            src="images/periphery/thumbs/01.jpg"
            width="1000"
            height="750"
            alt="Geometric industrial buildings beneath an overcast sky"
            loading="lazy"
            decoding="async"
          />
        </a> -->
      </div>

      <div class="column">
        <a
          class="tile"
          data-mobile-order="2"
          href="images/other/other-web-1.jpg"
          aria-label="View: Blue reflections rippling across a glass facade"

          <img
            src="images/other/other-thumb-1.jpg"
            width="1000"
            height="562"

            loading="eager"
            fetchpriority="high"
          />
        </a>
        <a class="tile" data-mobile-order="4" href="images/mit/03-web.jpg">
          <img
            src="images/mit/03-thumb.jpg"
            width="1000"
            height="800"
            loading="lazy"
            decoding="async"
          />
        </a>
        <a
          class="tile"
          data-mobile-order="6"
          href="images/marsh/web/03.jpg"
          aria-label="View: Rocks emerging from misty marsh water"
        >
          <img
            src="images/marsh/thumbs/03.jpg"
            width="1000"
            height="563"

            loading="lazy"
            decoding="async"
          />
        </a>
        <a

          data-mobile-order="10"

            src="images/foss/thumbs/02.jpg"

            src="images/other/other-thumb-3.jpg"

          class="tile"
          data-mobile-order="8"
          href="images/other/other-web-4.jpg"
          aria-label="View: Building and shadows creating semicircles"
        >
          <img
            src="images/other/other-web-4.jpg"
            width="1314"
            height="2000"
            alt="Building and shadows creating semicircles"
            loading="lazy"
            decoding="async"
          />
        </a> -->
      </div>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="Image preview">
      <div class="lightbox-media">
        <img class="lightbox-preview" id="lightbox-preview" alt="" />
        <img class="lightbox-full" id="lightbox-img" alt="" decoding="async" />
      </div>
      <button class="lightbox-close" type="button">Close</button>
    </dialog>

    <footer>
      <span class="contact" id="email"></span>
    </footer>

    <script>
      const tiles = document.querySelectorAll(".tile");
      const lightbox = document.getElementById("lightbox");
      const lightboxPreview = document.getElementById("lightbox-preview");
      const lightboxImg = document.getElementById("lightbox-img");
      const closeButton = lightbox.querySelector(".lightbox-close");
      const grid = document.querySelector(".grid");
      const desktopParents = new Map(
        Array.from(tiles, (tile) => [tile, tile.parentElement]),
      );
      const mobileLayout = window.matchMedia("(max-width: 700px)");
      let activeTile;
      let lightboxLoadId = 0;

      function syncPortfolioOrder() {
        if (mobileLayout.matches) {
          grid.classList.add("is-mobile-sequence");
          Array.from(tiles)
            .sort(
              (first, second) =>
                Number(first.dataset.mobileOrder) -
                Number(second.dataset.mobileOrder),
            )
            .forEach((tile) => grid.append(tile));
        } else {
          tiles.forEach((tile) => desktopParents.get(tile).append(tile));
          grid.classList.remove("is-mobile-sequence");
        }
      }

      syncPortfolioOrder();
      mobileLayout.addEventListener("change", syncPortfolioOrder);

      tiles.forEach((tile) => {
        const thumbnail = tile.querySelector("img");

        function revealThumbnail() {
          const reveal = () => {
            requestAnimationFrame(() => tile.classList.add("is-loaded"));
          };

          if (thumbnail.decode) {
            thumbnail.decode().then(reveal, reveal);
          } else {
            reveal();
          }
        }

        if (thumbnail.complete) {
          revealThumbnail();
        } else {
          thumbnail.addEventListener("load", revealThumbnail, { once: true });
          thumbnail.addEventListener(
            "error",
            () => tile.classList.add("is-loaded"),
            { once: true },
          );
        }

        tile.addEventListener("click", (event) => {
          event.preventDefault();

          const loadId = ++lightboxLoadId;
          activeTile = tile;
          lightbox.classList.remove("is-loaded", "is-error");
          lightboxPreview.src = thumbnail.currentSrc || thumbnail.src;
          lightboxImg.alt = thumbnail.alt;
          lightboxImg.removeAttribute("src");
          document.body.classList.add("lightbox-open");
          lightbox.showModal();

          lightboxImg.onload = () => {
            const reveal = () => {
              if (loadId !== lightboxLoadId || !lightbox.open) return;
              requestAnimationFrame(() => lightbox.classList.add("is-loaded"));
            };

            if (lightboxImg.decode) {
              lightboxImg.decode().then(reveal, reveal);
            } else {
              reveal();
            }
          };

          lightboxImg.onerror = () => {
            if (loadId === lightboxLoadId) {
              lightbox.classList.add("is-error");
            }
          };

          lightboxImg.src = tile.href;
        });
      });

      function closeLightbox() {
        if (lightbox.open) lightbox.close();
      }

      function resetLightbox() {
        lightboxLoadId += 1;
        document.body.classList.remove("lightbox-open");
        lightbox.classList.remove("is-loaded", "is-error");
        lightboxPreview.removeAttribute("src");
        lightboxImg.removeAttribute("src");
        lightboxImg.alt = "";
        lightboxImg.onload = null;
        lightboxImg.onerror = null;
        activeTile?.focus();
        activeTile = undefined;
      }

      closeButton.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      lightbox.addEventListener("close", resetLightbox);

      const email = ["hello", "@", "stephenjue", ".", "com"].join("");
      const emailLink = document.createElement("a");
      emailLink.href = `mailto:${email}`;
      emailLink.textContent = "contact";
      document.getElementById("email").append(emailLink);
    </script>

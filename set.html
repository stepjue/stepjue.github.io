<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stephen Jue</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lekton:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="identity">
    <a class="identity__name" href="/">Stephen Jue</a>
    <div class="contact-panel">
      <span id="email"></span>
    </div>
  </header>

  <div class="set-meta" id="set-title"></div>

  <main class="grid" id="grid"></main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="sets.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const setId = params.get("set");
    const set = sets[setId];

    if (!set) {
      document.body.innerHTML = "<p>Set not found.</p>";
      throw new Error("Set not found");
    }

    document.title = `${set.title} / Stephen Jue`;
    document.getElementById("set-title").textContent = set.title;

    const grid = document.getElementById("grid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    set.images.forEach(filename => {
      const tile = document.createElement("a");
      tile.className = "tile";
      tile.href = `${set.path}/web/${filename}`;

      const img = document.createElement("img");
      img.src = `${set.path}/thumbs/${filename}`;
      img.alt = "";
      img.draggable = false;

      tile.appendChild(img);
      grid.appendChild(tile);

      tile.addEventListener("click", event => {
        event.preventDefault();
        lightboxImg.src = tile.href;
        lightbox.classList.add("open");
      });
    });

    lightbox.addEventListener("click", () => {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        lightbox.classList.remove("open");
        lightboxImg.src = "";
      }
    });

    const email = ["hello", "@", "stephenjue", ".", "com"].join("");
    document.getElementById("email").innerHTML =
      `<a href="mailto:${email}">${email}</a>`;
  </script>
</body>
</html>
